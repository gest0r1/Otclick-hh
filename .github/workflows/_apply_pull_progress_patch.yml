name: Apply installer live-progress patch

on:
  push:
    branches:
      - fix/installer-pull-progress

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/installer-pull-progress

      - name: Patch updater and regression checks
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/apply_patch.py
          python3 /tmp/apply_patch.py
          bash -n install-update.sh
          python3 -m py_compile backend/tests/test_incremental_installer_contract.py
          rm -f .github/workflows/_apply_pull_progress_patch.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add install-update.sh backend/tests/test_incremental_installer_contract.py .github/workflows/build-artifact.yml .github/workflows/_apply_pull_progress_patch.yml
          git commit -m 'Show live Docker pull progress during install'
          git push origin HEAD:fix/installer-pull-progress
