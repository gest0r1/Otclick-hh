name: Apply installer live-progress patch

on:
  push:
    branches:
      - fix/installer-pull-progress

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/installer-pull-progress

      - name: Patch updater and regression checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('install-update.sh')
          s = p.read_text(encoding='utf-8')

          old = '''touch "$LOG_FILE"\nchmod 600 "$LOG_FILE"\nexec > >(tee -a "$LOG_FILE") 2>&1\n'''
          new = '''touch "$LOG_FILE"\nchmod 600 "$LOG_FILE"\n\n# Preserve the caller's real terminal before stdout/stderr are redirected to tee.\n# Docker sees a TTY on fd 3 and therefore renders its native layer progress\n# in-place instead of emitting one new line for every progress update.\nINTERACTIVE_TERMINAL=0\nexec 3>&1\nif [[ -t 3 ]]; then\n  INTERACTIVE_TERMINAL=1\nfi\nexec > >(tee -a "$LOG_FILE") 2>&1\n'''
          if old not in s:
              raise SystemExit('terminal redirection anchor not found')
          s = s.replace(old, new, 1)

          helpers = r'''
image_transfer_size() {
  local image_ref="$1"
  docker manifest inspect "$image_ref" 2>/dev/null | python3 -c '
import json, sys
try:
    data = json.load(sys.stdin)
except Exception:
    raise SystemExit(1)
total = sum(int(layer.get("size") or 0) for layer in data.get("layers", []))
if total <= 0:
    raise SystemExit(1)
n = float(total)
units = ("B", "KiB", "MiB", "GiB", "TiB")
for unit in units:
    if n < 1024 or unit == units[-1]:
        print(f"{n:.0f} {unit}" if unit == "B" else f"{n:.1f} {unit}")
        break
    n /= 1024
'
}

append_pull_transcript() {
  local transcript="$1"
  [[ -s "$transcript" ]] || return 0
  python3 - "$transcript" "$LOG_FILE" <<'PYLOG'
from pathlib import Path
import re
import sys

src = Path(sys.argv[1])
dst = Path(sys.argv[2])
ansi = re.compile(r"\x1b\[[0-?]*[ -/]*[@-~]")
text = src.read_bytes().decode("utf-8", "replace")
text = ansi.sub("", text).replace("\r", "\n")
with dst.open("a", encoding="utf-8") as out:
    for raw in text.splitlines():
        line = raw.strip()
        if not line or line.startswith("Script started on ") or line.startswith("Script done on "):
            continue
        out.write(line + "\n")
PYLOG
}

docker_pull_visible() {
  local name="$1" image_ref="$2" transcript rc

  if [[ "$INTERACTIVE_TERMINAL" != "1" ]]; then
    docker pull "$image_ref" >>"$LOG_FILE" 2>&1
    return $?
  fi

  printf '[otclick]       %s: Docker layer progress shows downloaded / total and updates in place\n' "$name" >&3

  if command -v script >/dev/null 2>&1; then
    transcript="$(mktemp /tmp/otclick-docker-pull.XXXXXX.log)"
    rc=0
    OTCLICK_PULL_IMAGE="$image_ref" script -qefc 'docker pull "$OTCLICK_PULL_IMAGE"' "$transcript" >&3 2>&3 || rc=$?
    append_pull_transcript "$transcript" || true
    rm -f "$transcript"
    return "$rc"
  fi

  # util-linux `script` is expected on supported Ubuntu hosts. If it is absent,
  # still send Docker directly to the original terminal so native progress stays
  # visible, at the cost of not mirroring the detailed pull transcript to the log.
  docker pull "$image_ref" >&3 2>&3
}

curl_download_visible() {
  local label="$1" url="$2" output="$3"
  if [[ "$INTERACTIVE_TERMINAL" == "1" ]]; then
    printf '[otclick]       %s: downloading (curl shows total, received, speed and ETA)\n' "$label" >&3
    curl -fL --retry 3 --retry-delay 2 --retry-all-errors --show-error \
      "$url" -o "$output" 2>&3
  else
    curl -fL --retry 3 --retry-delay 2 --retry-all-errors \
      "$url" -o "$output" >>"$LOG_FILE" 2>&1
  fi
}
'''
          anchor = '\nOLD_SHA="$(git rev-parse HEAD)"'
          if anchor not in s:
              raise SystemExit('helper insertion anchor not found')
          s = s.replace(anchor, '\n' + helpers + anchor, 1)

          old = '''  log "      $name: pulling immutable image from GHCR"\n  if docker pull "$image_ref" >>"$LOG_FILE" 2>&1; then\n'''
          new = '''  transfer_size="$(image_transfer_size "$image_ref" || true)"\n  if [[ -n "$transfer_size" ]]; then\n    log "      $name: pulling immutable image from GHCR (compressed image up to $transfer_size; cached layers are reused)"\n  else\n    log "      $name: pulling immutable image from GHCR"\n  fi\n  if docker_pull_visible "$name" "$image_ref"; then\n'''
          if old not in s:
              raise SystemExit('GHCR pull anchor not found')
          s = s.replace(old, new, 1)

          old = '''  curl -fL --retry 3 --retry-delay 2 --retry-all-errors \\\n    "${fallback_base}/${fallback_asset}" -o "$fallback_file" >>"$LOG_FILE" 2>&1\n'''
          new = '''  curl_download_visible "$name Release fallback" \\\n    "${fallback_base}/${fallback_asset}" "$fallback_file"\n'''
          if old not in s:
              raise SystemExit('fallback curl anchor not found')
          s = s.replace(old, new, 1)

          # shellcheck-style local declaration: transfer_size is used by pull_component.
          old = '''  local name="$1" image_ref="$2" fallback_tag="$3" fallback_asset="$4" local_tag="$5"\n  local fallback_base fallback_sums fallback_file expected actual\n'''
          new = '''  local name="$1" image_ref="$2" fallback_tag="$3" fallback_asset="$4" local_tag="$5"\n  local fallback_base fallback_sums fallback_file expected actual transfer_size\n'''
          if old not in s:
              raise SystemExit('pull_component locals anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

          tests = Path('backend/tests/test_incremental_installer_contract.py')
          t = tests.read_text(encoding='utf-8')
          if 'test_incremental_updater_exposes_native_pull_progress' not in t:
              t += '''\n\ndef test_incremental_updater_exposes_native_pull_progress():\n    updater = _read("install-update.sh")\n    assert "exec 3>&1" in updater\n    assert '[[ -t 3 ]]' in updater\n    assert "image_transfer_size" in updater\n    assert "Docker layer progress shows downloaded / total and updates in place" in updater\n    assert "script -qefc" in updater\n    assert "curl shows total, received, speed and ETA" in updater\n    assert 'docker_pull_visible "$name" "$image_ref"' in updater\n'''
              tests.write_text(t, encoding='utf-8')

          workflow = Path('.github/workflows/build-artifact.yml')
          w = workflow.read_text(encoding='utf-8')
          anchor = '          bash -n install-update.sh\n'
          addition = '''          bash -n install-update.sh\n          command -v script >/dev/null\n          script -qefc 'printf otclick-progress-smoke' /dev/null | grep -q 'otclick-progress-smoke'\n'''
          if 'otclick-progress-smoke' not in w:
              if anchor not in w:
                  raise SystemExit('artifact validation anchor not found')
              w = w.replace(anchor, addition, 1)
              workflow.write_text(w, encoding='utf-8')
          PY

          bash -n install-update.sh
          python3 -m py_compile backend/tests/test_incremental_installer_contract.py
          rm -f .github/workflows/_apply_pull_progress_patch.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add install-update.sh backend/tests/test_incremental_installer_contract.py .github/workflows/build-artifact.yml .github/workflows/_apply_pull_progress_patch.yml
          git commit -m 'Show live Docker pull progress during install'
          git push origin HEAD:fix/installer-pull-progress
