name: Add Caddy repair guard

on:
  push:
    branches: [fix/restore-production-proxy]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-production-proxy
          fetch-depth: 0
      - name: Patch updater repair behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('install-update.sh')
          t = p.read_text(encoding='utf-8')
          old = '''if [[ "$COMPOSE_CHANGED" == "1" ]]; then
            log "      compose changed; refreshing pinned third-party images"
            compose pull db migrate auth rest realtime storage storage-init kong caddy >>"$LOG_FILE" 2>&1
          else
            log "      compose unchanged; third-party image pull skipped"
          fi
          '''
          new = '''if [[ "$COMPOSE_CHANGED" == "1" ]]; then
            log "      compose changed; refreshing pinned third-party images"
            compose pull db migrate auth rest realtime storage storage-init kong caddy >>"$LOG_FILE" 2>&1
          elif ! docker image inspect caddy:2-alpine >/dev/null 2>&1; then
            log "      compose unchanged but Caddy image is missing; pulling Caddy only"
            compose pull caddy >>"$LOG_FILE" 2>&1
          else
            log "      compose unchanged; third-party image pull skipped"
          fi
          '''
          if old not in t:
              raise SystemExit('updater pull block not found')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')

          p = Path('backend/tests/test_incremental_installer_contract.py')
          t = p.read_text(encoding='utf-8')
          marker = '''    assert 'compose pull db migrate auth rest realtime storage storage-init kong caddy' in updater
            assert 'require_http "$CADDY_HEALTH_URL" internal-Caddy caddy 60' in updater
          '''
          replacement = '''    assert 'compose pull db migrate auth rest realtime storage storage-init kong caddy' in updater
            assert 'docker image inspect caddy:2-alpine' in updater
            assert 'compose pull caddy' in updater
            assert 'require_http "$CADDY_HEALTH_URL" internal-Caddy caddy 60' in updater
          '''
          if marker not in t:
              raise SystemExit('test marker not found')
          p.write_text(t.replace(marker, replacement, 1), encoding='utf-8')
          PY
          bash -n install-update.sh
          python3 -m py_compile backend/tests/test_incremental_installer_contract.py
          git diff --check
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install-update.sh backend/tests/test_incremental_installer_contract.py
          git commit -m "fix: repair missing Caddy image on repeat update"
          git push origin HEAD:fix/restore-production-proxy
