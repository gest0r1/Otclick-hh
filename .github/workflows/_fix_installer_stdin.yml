name: Fix installer stdin isolation

on:
  push:
    branches:
      - fix/installer-stdin-leak

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/installer-stdin-leak
      - name: Patch and validate stdin isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          install = Path('install.sh')
          s = install.read_text(encoding='utf-8')
          old = '''    OTCLICK_REPO_SLUG="$RELEASE_REPO" \\\n    bash "$tmp_update"\n'''
          new = '''    OTCLICK_REPO_SLUG="$RELEASE_REPO" \\\n    bash "$tmp_update" </dev/null\n'''
          if old not in s:
              raise SystemExit('install.sh updater exec anchor not found')
          s = s.replace(old, new, 1)
          install.write_text(s, encoding='utf-8')

          updater = Path('install-update.sh')
          u = updater.read_text(encoding='utf-8')
          anchor = '''if [[ "${EUID}" -ne 0 ]]; then\n  echo "Run as root (use sudo)." >&2\n  exit 1\nfi\n\n'''
          replacement = anchor + '''# The updater is deliberately non-interactive. When install.sh itself is run as\n# `curl ... | bash`, stdin may still contain unread bytes from install.sh after\n# the exec handoff. Disconnect stdin before any child process can consume and\n# echo that source text into the terminal.\nexec </dev/null\n\n'''
          if anchor not in u:
              raise SystemExit('updater stdin anchor not found')
          u = u.replace(anchor, replacement, 1)

          u = u.replace('docker pull "$image_ref" >>"$LOG_FILE" 2>&1',
                        'docker pull "$image_ref" </dev/null >>"$LOG_FILE" 2>&1')
          u = u.replace('script -qefc \'docker pull "$OTCLICK_PULL_IMAGE"\' "$transcript" >&3 2>&3',
                        'script -qefc \'docker pull "$OTCLICK_PULL_IMAGE"\' "$transcript" </dev/null >&3 2>&3')
          u = u.replace('docker pull "$image_ref" >&3 2>&3',
                        'docker pull "$image_ref" </dev/null >&3 2>&3')
          updater.write_text(u, encoding='utf-8')

          tests = Path('backend/tests/test_incremental_installer_contract.py')
          t = tests.read_text(encoding='utf-8')
          if 'test_curl_pipe_cannot_leak_remaining_installer_source_into_pull_tty' not in t:
              t += '''\n\ndef test_curl_pipe_cannot_leak_remaining_installer_source_into_pull_tty():\n    installer = _read("install.sh")\n    updater = _read("install-update.sh")\n    assert 'bash "$tmp_update" </dev/null' in installer\n    assert "exec </dev/null" in updater\n    assert "script -qefc" in updater\n    assert '"$transcript" </dev/null' in updater\n    assert 'docker pull "$image_ref" </dev/null' in updater\n'''
              tests.write_text(t, encoding='utf-8')
          PY

          bash -n install.sh
          bash -n install-update.sh
          python3 -m py_compile backend/tests/test_incremental_installer_contract.py

          printf 'SHOULD_NOT_APPEAR\n' | bash -c 'exec </dev/null; script -qefc "cat" /tmp/stdin-test.log </dev/null' > /tmp/stdin-test.out
          ! grep -q SHOULD_NOT_APPEAR /tmp/stdin-test.out
          ! grep -q SHOULD_NOT_APPEAR /tmp/stdin-test.log

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add install.sh install-update.sh backend/tests/test_incremental_installer_contract.py
          git commit -m 'Prevent curl-pipe source leaking into Docker progress TTY'
          git push origin HEAD:fix/installer-stdin-leak
