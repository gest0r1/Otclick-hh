name: Restore production proxy contract

on:
  push:
    branches:
      - fix/restore-production-proxy

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-production-proxy
          fetch-depth: 0

      - name: Apply proxy restoration patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/restore_proxy.py')
          t = p.read_text(encoding='utf-8')
          old = 'marker = "SERVICE_ROLE_KEY=\\n\\n"\nproxy_env = """SERVICE_ROLE_KEY='
          new = 'marker = "ANON_KEY=\\nSERVICE_ROLE_KEY=\\n\\n"\nproxy_env = """ANON_KEY=\nSERVICE_ROLE_KEY='
          if old not in t:
              raise SystemExit('temporary env marker not found')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY
          python3 .github/scripts/restore_proxy.py

      - name: Validate patch
        shell: bash
        run: |
          bash -n install.sh
          bash -n install-update.sh
          python3 -m py_compile backend/tests/test_incremental_installer_contract.py
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example docker-compose.yml infra/Caddyfile install.sh install-update.sh backend/tests/test_incremental_installer_contract.py
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "fix: restore production Caddy networking"
          git push origin HEAD:fix/restore-production-proxy
