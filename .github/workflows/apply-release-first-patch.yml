name: Apply release-first updater patch

on:
  push:
    branches:
      - perf/release-first-image-transport
    paths:
      - .github/workflows/apply-release-first-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: perf/release-first-image-transport
      - name: Patch updater, env example and contracts
        env:
          PATCH_B64: "  i9pbnN0YWxsLXN0YXRlLmpzb24iICIkY29tcG9uZW50IiAiJHRhcmdldF9oYXNoIiAiJGxvY2FsX2lkIiA8PCdQWVN      bWFya2VyLCAxKQplbnYud3JpdGVfdGV4dChlKQoKdCA9IFBhdGgoJ2JhY2tlbmQvdGVzdHMvdGVzdF9pbmNyZW1lbnRhbF9pbnN0YWxsZXJfY29udHJhY3QucHknKQp4ID0gdC5yZWFkX3RleHQoKQp4ID0gcmUuc3ViKAogICAgcidkZWYgdGVzdF9pbmNyZW1lbnRhbF91cGRhdGVyX3VzZXNfcmVsZWFzZV9mYWxsYmFja19vbmx5X2FmdGVyX2doY3JfZmFpbHVyZVwoXCk6XG4oPzogICAgLipc biksKz9cbig/  biksKz9cbig/ "
        run: |
          printf '%s' "$PATCH_B64" | base64 -d | python3
          bash -n install-update.sh
          python3 -m py_compile backend/tests/test_incremental_installer_contract.py backend/tests/test_build_artifact_contract.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add install-update.sh .env.example backend/tests/test_incremental_installer_contract.py backend/tests/test_build_artifact_contract.py
          git commit -m "perf: prefer Release component transport"
          git push origin HEAD:perf/release-first-image-transport
