name: Apply release-first updater patch

on:
  push:
    branches:
      - perf/release-first-image-transport
    paths:
      - .github/workflows/apply-release-first-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: perf/release-first-image-transport
      - name: Patch updater, env example and contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('install-update.sh')
          s = p.read_text()
          s = s.replace(
              '# It downloads only a tiny exact-SHA manifest, then pulls changed application\n# components from GHCR so Docker can reuse cached layers. GitHub Release\n# component archives are a fallback only; the combined fresh-install bundle is\n# never downloaded by this script.',
              '# It downloads only a tiny exact-SHA manifest, then downloads only changed\n# application components. GitHub Release component archives are the production\n# default because some hosting networks route GHCR blob traffic very slowly; GHCR\n# remains an immutable fallback/override. The combined fresh-install bundle is\n# never downloaded by this script.'
          )
          s = s.replace(
              'log "      installing zstd for Release fallback"',
              'log "      installing zstd for component Release transport"'
          )
          s = s.replace(
              'command -v zstd >/dev/null 2>&1 || die "zstd is required only for the GitHub Release fallback, but could not be installed"',
              'command -v zstd >/dev/null 2>&1 || die "zstd is required for the GitHub Release component transport, but could not be installed"'
          )

          old = re.search(r'image_matches_target\(\) \{.*?\n\}\n\n\nimage_transfer_size\(\)', s, re.S)
          assert old, 'image_matches_target block not found'
          new = r'''image_matches_target() {
  local target_hash="$1" local_tag="$2" component="$3" local_id
  docker image inspect "$local_tag" >/dev/null 2>&1 || return 1
  [[ -f "$STATE_DIR/install-state.json" ]] || return 1
  local_id="$(docker image inspect "$local_tag" --format '{{.Id}}')"
  python3 - "$STATE_DIR/install-state.json" "$component" "$target_hash" "$local_id" <<'PYSTATE'
import json
import sys

path, component, target_hash, local_id = sys.argv[1:]
try:
    data = json.load(open(path, encoding="utf-8"))
except Exception:
    raise SystemExit(1)
if data.get(f"{component}_hash") != target_hash:
    raise SystemExit(1)
if data.get(f"{component}_image_id") != local_id:
    raise SystemExit(1)
PYSTATE
}


image_transfer_size()'''
          s = s[:old.start()] + new + s[old.end():]

          s = s.replace(
              'image_matches_target "$TARGET_BACKEND_IMAGE" aiautoclicker-backend:latest || BACKEND_CHANGED=1\nimage_matches_target "$TARGET_FRONTEND_IMAGE" aiautoclicker-frontend:latest || FRONTEND_CHANGED=1',
              'image_matches_target "$TARGET_BACKEND_HASH" aiautoclicker-backend:latest backend || BACKEND_CHANGED=1\nimage_matches_target "$TARGET_FRONTEND_HASH" aiautoclicker-frontend:latest frontend || FRONTEND_CHANGED=1'
          )

          block = re.search(r'pull_component\(\) \{.*?\n\}\n\nlog "\[3/7\] updating changed application components"', s, re.S)
          assert block, 'pull_component block not found'
          replacement = r'''pull_component_from_release() {
  local name="$1" fallback_tag="$2" fallback_asset="$3" local_tag="$4"
  local fallback_base fallback_sums fallback_file expected actual

  ensure_zstd
  fallback_base="https://github.com/${REPO_SLUG}/releases/download/${fallback_tag}"
  fallback_sums="$(mktemp /tmp/otclick-component-sums.XXXXXX)"
  fallback_file="$(mktemp /tmp/otclick-component.XXXXXX.tar.zst)"
  curl -fsSL --retry 3 --retry-delay 2 "${fallback_base}/SHA256SUMS" -o "$fallback_sums" \
    || { rm -f "$fallback_sums" "$fallback_file"; return 21; }
  expected="$(awk -v asset="$fallback_asset" '$2 == asset || $2 == "./" asset {print $1; exit}' "$fallback_sums")"
  [[ -n "$expected" ]] || { rm -f "$fallback_sums" "$fallback_file"; return 22; }
  curl_download_visible "$name component Release" \
    "${fallback_base}/${fallback_asset}" "$fallback_file" || { rm -f "$fallback_sums" "$fallback_file"; return 23; }
  actual="$(sha256sum "$fallback_file" | awk '{print $1}')"
  [[ "$actual" == "$expected" ]] || { rm -f "$fallback_sums" "$fallback_file"; return 24; }
  zstd -d -c "$fallback_file" | docker load >>"$LOG_FILE" 2>&1 || { rm -f "$fallback_sums" "$fallback_file"; return 25; }
  rm -f "$fallback_sums" "$fallback_file"
  docker image inspect "$local_tag" >/dev/null 2>&1 || return 26
  log "      $name: component Release loaded"
}

pull_component_from_ghcr() {
  local name="$1" image_ref="$2" local_tag="$3" transfer_size
  transfer_size="$(image_transfer_size "$image_ref" || true)"
  if [[ -n "$transfer_size" ]]; then
    log "      $name: pulling immutable image from GHCR (compressed image up to $transfer_size; cached layers are reused)"
  else
    log "      $name: pulling immutable image from GHCR"
  fi
  docker_pull_visible "$name" "$image_ref" || return $?
  docker tag "$image_ref" "$local_tag"
  log "      $name: GHCR pull complete (cached layers reused)"
}

pull_component() {
  local name="$1" image_ref="$2" fallback_tag="$3" fallback_asset="$4" local_tag="$5"
  local requested transport
  requested="${OTCLICK_IMAGE_TRANSPORT:-$(env_get OTCLICK_IMAGE_TRANSPORT)}"
  requested="${requested:-release}"
  case "$requested" in
    auto)
      # Release-first is intentionally the current auto policy. It preserves the
      # fast GitHub Release CDN path observed on production hosting while GHCR
      # remains a content-addressed fallback.
      transport="release"
      ;;
    release|ghcr)
      transport="$requested"
      ;;
    *)
      die "invalid OTCLICK_IMAGE_TRANSPORT=$requested (expected auto/release/ghcr)"
      ;;
  esac

  log "      $name: image transport=$requested (effective=$transport)"
  if [[ "$transport" == "release" ]]; then
    if pull_component_from_release "$name" "$fallback_tag" "$fallback_asset" "$local_tag"; then
      return 0
    fi
    log "      $name: component Release unavailable; falling back to GHCR"
    pull_component_from_ghcr "$name" "$image_ref" "$local_tag"
    return $?
  fi

  if pull_component_from_ghcr "$name" "$image_ref" "$local_tag"; then
    return 0
  fi
  log "      $name: GHCR unavailable; falling back to component Release"
  pull_component_from_release "$name" "$fallback_tag" "$fallback_asset" "$local_tag"
}

log "[3/7] updating changed application components"'''
          s = s[:block.start()] + replacement + s[block.end():]

          old_state = '''python3 - "$STATE_DIR/install-state.json" "$TARGET_SHA" "$TARGET_BACKEND_HASH" "$TARGET_FRONTEND_HASH" "$TARGET_COMPOSE_HASH" "$TARGET_INFRA_HASH" "$TARGET_MIGRATIONS_HASH" <<'PY'\nimport json\nfrom pathlib import Path\nimport sys\nfrom datetime import datetime, timezone\n\npath = Path(sys.argv[1])\nstate = {\n    "schema_version": 1,\n    "git_sha": sys.argv[2],\n    "backend_hash": sys.argv[3],\n    "frontend_hash": sys.argv[4],\n    "compose_hash": sys.argv[5],\n    "infra_hash": sys.argv[6],\n    "migrations_hash": sys.argv[7],\n    "updated_at": datetime.now(timezone.utc).isoformat(),\n}\n'''
          new_state = '''BACKEND_IMAGE_ID="$(docker image inspect aiautoclicker-backend:latest --format '{{.Id}}')"\nFRONTEND_IMAGE_ID="$(docker image inspect aiautoclicker-frontend:latest --format '{{.Id}}')"\npython3 - "$STATE_DIR/install-state.json" "$TARGET_SHA" "$TARGET_BACKEND_HASH" "$TARGET_FRONTEND_HASH" "$TARGET_COMPOSE_HASH" "$TARGET_INFRA_HASH" "$TARGET_MIGRATIONS_HASH" "$BACKEND_IMAGE_ID" "$FRONTEND_IMAGE_ID" <<'PY'\nimport json\nfrom pathlib import Path\nimport sys\nfrom datetime import datetime, timezone\n\npath = Path(sys.argv[1])\nstate = {\n    "schema_version": 2,\n    "git_sha": sys.argv[2],\n    "backend_hash": sys.argv[3],\n    "frontend_hash": sys.argv[4],\n    "compose_hash": sys.argv[5],\n    "infra_hash": sys.argv[6],\n    "migrations_hash": sys.argv[7],\n    "backend_image_id": sys.argv[8],\n    "frontend_image_id": sys.argv[9],\n    "updated_at": datetime.now(timezone.utc).isoformat(),\n}\n'''
          assert old_state in s, 'state block not found'
          s = s.replace(old_state, new_state)
          p.write_text(s)

          env = Path('.env.example')
          e = env.read_text()
          marker = '# ─── Backend app ───\n'
          insert = '''# Incremental application image transport. Release is the production default:\n# it downloads only the changed backend/frontend .tar.zst component over the\n# GitHub Release CDN, then verifies SHA-256 and docker-loads it. GHCR stays as\n# the immutable fallback. Set ghcr to force Docker registry layer pulls.\nOTCLICK_IMAGE_TRANSPORT=release\n\n'''
          assert marker in e
          e = e.replace(marker, insert + marker, 1)
          env.write_text(e)

          t = Path('backend/tests/test_incremental_installer_contract.py')
          x = t.read_text()
          x = x.replace(
              'def test_incremental_updater_uses_release_fallback_only_after_ghcr_failure():\n    updater = _read("install-update.sh")\n    ghcr = updater.index(\'docker pull "$image_ref"\')\n    fallback = updater.index(\'using component Release fallback\')\n    zstd = updater.index(\'ensure_zstd\')\n    assert ghcr < fallback\n    assert zstd < fallback\n    assert \'command -v zstd\' in updater\n',
              '''def test_incremental_updater_is_release_first_with_configurable_transport():\n    updater = _read("install-update.sh")\n    env_example = _read(".env.example")\n    assert 'OTCLICK_IMAGE_TRANSPORT:-$(env_get OTCLICK_IMAGE_TRANSPORT)' in updater\n    assert 'requested="${requested:-release}"' in updater\n    assert 'auto)' in updater\n    assert 'release|ghcr)' in updater\n    assert 'component Release unavailable; falling back to GHCR' in updater\n    assert 'GHCR unavailable; falling back to component Release' in updater\n    assert 'OTCLICK_IMAGE_TRANSPORT=release' in env_example\n\n'''
          )
          x = x.replace(
              '''def test_incremental_updater_requires_exact_target_digest_not_just_latest_tag():\n    updater = _read("install-update.sh")\n    assert 'image_matches_target()' in updater\n    assert 'docker image inspect "$target_ref"' in updater\n    assert 'docker image inspect "$local_tag"' in updater\n    assert 'target_id=' in updater\n    assert 'local_id=' in updater\n    assert 'image_matches_target "$TARGET_BACKEND_IMAGE" aiautoclicker-backend:latest || BACKEND_CHANGED=1' in updater\n    assert 'image_matches_target "$TARGET_FRONTEND_IMAGE" aiautoclicker-frontend:latest || FRONTEND_CHANGED=1' in updater\n''',
              '''def test_incremental_updater_verifies_loaded_image_against_persisted_component_state():\n    updater = _read("install-update.sh")\n    assert 'image_matches_target()' in updater\n    assert 'install-state.json' in updater\n    assert 'backend_image_id' in updater\n    assert 'frontend_image_id' in updater\n    assert 'image_matches_target "$TARGET_BACKEND_HASH" aiautoclicker-backend:latest backend || BACKEND_CHANGED=1' in updater\n    assert 'image_matches_target "$TARGET_FRONTEND_HASH" aiautoclicker-frontend:latest frontend || FRONTEND_CHANGED=1' in updater\n'''
          )
          t.write_text(x)

          tb = Path('backend/tests/test_build_artifact_contract.py')
          b = tb.read_text()
          b += '''\n\ndef test_component_builds_use_persistent_buildx_cache():\n    workflow = _workflow()\n    assert "docker/setup-buildx-action@" in workflow\n    assert "docker/build-push-action@" in workflow\n    assert "cache-from: type=gha,scope=backend" in workflow\n    assert "cache-to: type=gha,mode=max,scope=backend" in workflow\n    assert "cache-from: type=gha,scope=frontend" in workflow\n    assert "cache-to: type=gha,mode=max,scope=frontend" in workflow\n'''
          tb.write_text(b)
          PY

          bash -n install-update.sh
          python3 -m py_compile backend/tests/test_incremental_installer_contract.py backend/tests/test_build_artifact_contract.py

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add install-update.sh .env.example backend/tests/test_incremental_installer_contract.py backend/tests/test_build_artifact_contract.py
          git commit -m "perf: prefer Release component transport"
          git push origin HEAD:perf/release-first-image-transport
