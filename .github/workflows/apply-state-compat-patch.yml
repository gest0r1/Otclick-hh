name: Apply updater state compatibility patch

on:
  push:
    branches:
      - perf/release-first-image-transport
    paths:
      - .github/workflows/apply-state-compat-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: perf/release-first-image-transport
      - name: Apply and validate
        run: |
          set -euo pipefail
          python3 tools/patch_state_compat.py
          bash -n install-update.sh
          python3 -m pytest -q backend/tests/test_incremental_installer_contract.py backend/tests/test_build_artifact_contract.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add install-update.sh
          git commit -m "fix: preserve exact images across updater state upgrade"
          git push origin HEAD:perf/release-first-image-transport
