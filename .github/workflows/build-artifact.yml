name: Build Linux install artifact

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".dockerignore"
      - "docker-compose.yml"
      - "install.sh"
      - "install-one.sh"
      - ".github/workflows/build-artifact.yml"

permissions:
  contents: write

# Distribution/diagnostic artifact: prebuilt app images plus exact installer and
# compose metadata for this commit. Runtime secrets and .env are never included.
# The bundle is also valid for external reverse-proxy mode (e.g. Nginx Proxy Manager).
concurrency:
  group: install-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  noncommercial-cleanup:
    if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'chore: trigger noncommercial cleanup' }}"
    name: Finalize noncommercial runtime cleanup
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: feature/persistent-vacancy-funnel
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Remove final runtime commercial leftovers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          install = Path("install.sh")
          text = install.read_text(encoding="utf-8")
          stale = '  env_set POLAR_SUCCESS_URL "$public_url/billing/success"\n'
          if stale not in text:
              raise SystemExit("expected stale POLAR_SUCCESS_URL line was not found")
          install.write_text(text.replace(stale, "", 1), encoding="utf-8")

          test = Path("backend/tests/test_noncommercial_contract.py")
          text = test.read_text(encoding="utf-8")
          old = '''    pyproject = (ROOT / "pyproject.toml").read_text(encoding="utf-8")\n\n    for token in (\n'''
          new = '''    pyproject = (ROOT / "pyproject.toml").read_text(encoding="utf-8")\n    uv_lock = (ROOT / "uv.lock").read_text(encoding="utf-8")\n    installer = (ROOT / "install.sh").read_text(encoding="utf-8")\n\n    for token in (\n'''
          if old not in text:
              raise SystemExit("noncommercial contract test shape changed unexpectedly")
          text = text.replace(old, new, 1)
          old_assert = '    assert "polar-sdk" not in pyproject\n'
          new_assert = '''    assert "polar-sdk" not in pyproject\n    assert "polar-sdk" not in uv_lock\n    assert "POLAR_" not in installer\n'''
          if old_assert not in text:
              raise SystemExit("polar-sdk assertion not found")
          test.write_text(text.replace(old_assert, new_assert, 1), encoding="utf-8")
          PY

          uv lock
          bash -n install.sh
          uv run ruff check backend/tests/test_noncommercial_contract.py
          uv run pytest backend/tests/test_noncommercial_contract.py -q

          python3 - <<'PY'
          from pathlib import Path

          targets = [
              Path("backend/app"),
              Path("frontend/src"),
              Path("install.sh"),
              Path(".env.example"),
              Path("pyproject.toml"),
              Path("uv.lock"),
          ]
          forbidden = (
              "POLAR_",
              "BILLING_ENABLED",
              "FREE_TOTAL_APPLIES",
              "PAID_DAILY_APPLIES",
              "PLAN_CURRENCY",
              'href="/billing"',
              "/api/billing/",
              "Подписка Pro",
              "открыть тарифы",
              "дальше нужен тариф",
              "polar-sdk",
          )
          hits = []
          for root in targets:
              files = root.rglob("*") if root.is_dir() else [root]
              for path in files:
                  if not path.is_file():
                      continue
                  try:
                      text = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  for token in forbidden:
                      if token in text:
                          hits.append(f"{path}: {token}")
          if hits:
              raise SystemExit("commercial runtime leftovers:\n" + "\n".join(hits))
          print("noncommercial runtime audit: clean")
          PY

          git config user.name "gest0r1"
          git config user.email "gest0r@mail.ru"
          git add install.sh uv.lock backend/tests/test_noncommercial_contract.py
          git diff --cached --check
          git commit -m "chore: finish noncommercial runtime cleanup"
          git push origin HEAD:feature/persistent-vacancy-funnel

  build-linux-amd64:
    if: "${{ github.event_name != 'push' || github.event.head_commit.message != 'chore: trigger noncommercial cleanup' }}"
    name: Build Linux amd64 bundle
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Prepare deterministic build config
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n install-one.sh
          python3 -m py_compile infra/bootstrap.py infra/verify_llm.py backend/scripts/load_candidate_data.py
          python3 infra/bootstrap.py --openai-key ci-placeholder
          docker compose config >/dev/null

      - name: Build Otclick application images
        run: |
          set -euo pipefail
          docker compose build api frontend
          docker image inspect aiautoclicker-backend:latest >/dev/null
          docker image inspect aiautoclicker-frontend:latest >/dev/null

      - name: Package install artifact
        id: package
        run: |
          set -euo pipefail
          command -v zstd >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq zstd; }
          mkdir -p artifacts

          docker save \
            aiautoclicker-backend:latest \
            aiautoclicker-frontend:latest \
            | zstd -T0 -10 -o artifacts/otclick-images-linux-amd64.tar.zst

          cp install.sh install-one.sh docker-compose.yml artifacts/

          python3 - <<'PY'
          import json
          import os
          import platform
          from pathlib import Path

          out = Path("artifacts")
          manifest = {
              "schema_version": 1,
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "git_sha": os.environ.get("GITHUB_SHA"),
              "git_ref": os.environ.get("GITHUB_REF"),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "architecture": "linux/amd64",
              "runner_machine": platform.machine(),
              "docker_images": [
                  "aiautoclicker-backend:latest",
                  "aiautoclicker-frontend:latest",
              ],
              "bundle": "otclick-images-linux-amd64.tar.zst",
          }
          (out / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          (cd artifacts && sha256sum \
            otclick-images-linux-amd64.tar.zst \
            install.sh install-one.sh docker-compose.yml manifest.json \
            > SHA256SUMS)

          echo "bundle_size=$(du -h artifacts/otclick-images-linux-amd64.tar.zst | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload Linux install artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: otclick-linux-amd64-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
          # The Docker bundle is already zstd-compressed; recompressing it only
          # wastes runner time and does not materially reduce artifact size.
          compression-level: 0

      - name: Publish public prerelease install assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="install-${GITHUB_SHA}"
          title="Otclick install bundle ${GITHUB_SHA:0:12}"
          notes="Prebuilt Linux amd64 install bundle for commit ${GITHUB_SHA}. Generated by GitHub Actions; no runtime secrets are included."

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              artifacts/otclick-images-linux-amd64.tar.zst \
              artifacts/manifest.json \
              artifacts/SHA256SUMS \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" \
              artifacts/otclick-images-linux-amd64.tar.zst \
              artifacts/manifest.json \
              artifacts/SHA256SUMS \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "$title" \
              --notes "$notes" \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Publish artifact summary
        run: |
          {
            echo "### Otclick Linux install artifact"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Bundle: \`otclick-images-linux-amd64.tar.zst\` (${{ steps.package.outputs.bundle_size }})"
            echo "- Actions artifact: [download](${{ steps.upload.outputs.artifact-url }})"
            echo "- Public prerelease: https://github.com/${GITHUB_REPOSITORY}/releases/tag/install-${GITHUB_SHA}"
            echo "- SHA256: included in \`SHA256SUMS\`"
            echo "- Actions artifact retention: 7 days"
          } >> "$GITHUB_STEP_SUMMARY"
