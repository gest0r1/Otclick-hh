name: One-shot test contract alignment

on:
  push:
    branches:
      - "feature/persistent-vacancy-funnel"
    paths:
      - ".github/workflows/maintenance-align-tests.yml"

permissions:
  contents: write

jobs:
  align-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: feature/persistent-vacancy-funnel

      - name: Align tests with current safety and deployment contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_s: str, old: str, new: str) -> None:
              path = Path(path_s)
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one match for {old!r}, got {text.count(old)}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          # This unit test stubs every network side effect and explicitly opts
          # through the kill switch so it can test multipart payload shape.
          replace_once(
              "backend/tests/test_form_filler.py",
              '    monkeypatch.setattr(form_filler, "_post_response", _fake_post)\n',
              '    monkeypatch.setattr(form_filler.settings, "ALLOW_REAL_APPLY", True)\n'
              '    monkeypatch.setattr(form_filler, "_post_response", _fake_post)\n',
          )

          # Production self-hosting is same-origin through Caddy. API/Kong are
          # still bound on localhost for diagnostics, not publicly exposed.
          replace_once(
              "backend/tests/test_local_stack_config.py",
              '''def test_compose_api_url_default_points_at_backend():\n    compose = _read("docker-compose.yml")\n\n    match = re.search(r"NEXT_PUBLIC_API_URL:\\s*\\$\\{NEXT_PUBLIC_API_URL:-([^}]+)\\}", compose)\n    assert match, "compose must define a NEXT_PUBLIC_API_URL build arg with a default"\n    assert match.group(1).strip().endswith(f":{BACKEND_PORT}")\n\n\ndef test_compose_publishes_both_ports():\n    compose = _read("docker-compose.yml")\n\n    assert f'"{KONG_PORT}:8000"' in compose, "Kong must be published on 54321"\n    assert f'"{BACKEND_PORT}:8000"' in compose, "backend must be published on 8000"\n''',
              '''def test_compose_browser_api_default_uses_caddy_same_origin():\n    compose = _read("docker-compose.yml")\n\n    match = re.search(r"NEXT_PUBLIC_API_URL:\\s*\\$\\{NEXT_PUBLIC_API_URL:-([^}]+)\\}", compose)\n    assert match, "compose must define a NEXT_PUBLIC_API_URL build arg with a default"\n    assert match.group(1).strip() == "http://localhost"\n\n\ndef test_compose_keeps_api_and_kong_diagnostics_on_loopback():\n    compose = _read("docker-compose.yml")\n\n    assert f'"127.0.0.1:{KONG_PORT}:8000"' in compose\n    assert f'"127.0.0.1:{BACKEND_PORT}:8000"' in compose\n''',
          )
          replace_once(
              "backend/tests/test_local_stack_config.py",
              '    assert _env_value(text, "SUPABASE_PUBLIC_URL") == f"http://localhost:{KONG_PORT}"\n',
              '    assert _env_value(text, "SUPABASE_PUBLIC_URL") == "http://localhost"\n',
          )

          # Sanitization deliberately trims boundary whitespace before storing.
          replace_once(
              "backend/tests/test_pipeline_cover_letters.py",
              '    assert _validate_draft(text, {"fact-1"}) == text\n',
              '    assert _validate_draft(text, {"fact-1"}) == text.strip()\n',
          )

          # Rule matching is intentionally deterministic substring matching, not
          # stemming/morphology; use stable stems across Russian cases.
          replace_once(
              "backend/tests/test_selection_rules.py",
              '        "title_any": ["инфраструктура"],\n',
              '        "title_any": ["инфраструктур"],\n',
          )
          replace_once(
              "backend/tests/test_selection_rules.py",
              '        "description_any": ["дежурство 24/7"],\n',
              '        "description_any": ["дежурств"],\n',
          )

          # worker_enabled now controls discovery/scoring only. Legacy apply is
          # always false at Registry.reconcile; sending remains a separate queue.
          replace_once(
              "backend/tests/test_worker_control.py",
              '''    with patch.object(worker_main, "active_user_flags", return_value=flags), \\\n         patch.object(worker_main, "filter_paid", side_effect=lambda u: u):\n        await worker_main._reconcile(registry)\n\n    calls = {c.args[0]: c.args[1:] for c in registry.reconcile.await_args_list}\n    assert calls["a"] == (True, False)   # newly desired apply-only\n    assert calls["b"] == (False, True)   # agent-only\n    assert calls["c"] == (False, False)  # live but no longer desired → stop both\n''',
              '''    with (\n        patch.object(worker_main, "active_user_flags", return_value=flags),\n        patch.object(worker_main, "filter_paid", side_effect=lambda u: u),\n        patch.object(worker_main, "_run_discovery_if_due", new=AsyncMock()) as discovery,\n    ):\n        await worker_main._reconcile(registry)\n\n    calls = {c.args[0]: c.args[1:] for c in registry.reconcile.await_args_list}\n    assert calls["a"] == (False, False)  # discovery is separate; legacy apply never starts\n    assert calls["b"] == (False, True)   # recruiter agent only\n    assert calls["c"] == (False, False)  # no longer desired → stop runner\n    discovery.assert_any_await("a", True)\n    discovery.assert_any_await("b", False)\n''',
          )
          replace_once(
              "backend/tests/test_worker_control.py",
              '''    with patch.object(worker_main, "active_user_flags", return_value=flags), \\\n         patch.object(worker_main, "filter_paid", side_effect=lambda u: []):\n        await worker_main._reconcile(registry)\n\n    registry.reconcile.assert_awaited_once_with("a", True, False)\n''',
              '''    with (\n        patch.object(worker_main, "active_user_flags", return_value=flags),\n        patch.object(worker_main, "filter_paid", side_effect=lambda u: []),\n        patch.object(worker_main, "_run_discovery_if_due", new=AsyncMock()) as discovery,\n    ):\n        await worker_main._reconcile(registry)\n\n    registry.reconcile.assert_awaited_once_with("a", False, False)\n    discovery.assert_awaited_once_with("a", True)\n''',
          )

          replace_once(
              "backend/tests/test_worker_discovery_mode.py",
              '        patch.object(worker_main.time, "monotonic", side_effect=[100.0, 101.0]),\n',
              '        patch.object(worker_main, "_monotonic", side_effect=[100.0, 101.0]),\n',
          )
          PY

      - name: Validate aligned contracts
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Run focused tests and Ruff
        run: |
          set -euo pipefail
          uv sync --dev
          uv run ruff check backend
          uv run pytest -q \
            backend/tests/test_form_filler.py \
            backend/tests/test_local_stack_config.py \
            backend/tests/test_pipeline_cover_letters.py \
            backend/tests/test_selection_rules.py \
            backend/tests/test_worker_control.py \
            backend/tests/test_worker_discovery_mode.py

      - name: Commit validated contract updates
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests
          git commit -m "test: align contracts with safe funnel architecture"
          git push origin HEAD:feature/persistent-vacancy-funnel
