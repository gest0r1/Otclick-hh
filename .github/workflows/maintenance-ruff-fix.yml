name: One-shot Ruff fix

on:
  push:
    branches:
      - "feature/persistent-vacancy-funnel"
    paths:
      - ".github/workflows/maintenance-ruff-fix.yml"

permissions:
  contents: write

jobs:
  ruff-fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: feature/persistent-vacancy-funnel

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Apply Ruff safe fixes
        run: |
          set -euo pipefail
          uv sync --dev
          uv run ruff check backend --fix
          uv run ruff check backend

      - name: Commit mechanical fixes
        run: |
          set -euo pipefail
          if git diff --quiet -- backend; then
            echo "No Ruff changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "style: apply Ruff safe fixes"
          git push origin HEAD:feature/persistent-vacancy-funnel
